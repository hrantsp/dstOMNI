# Windows build target.
#
# Built with MSVC, matching the official Qt binaries the qt-official recipe fetches
# (win64_msvc2022_64). MinGW Qt builds are not interchangeable with those.

# The operating system this target is built on. There is no cross-compilation:
# Qt's deployment tools only run on their own platform, so dst.py refuses to build
# or package a target that is not this machine rather than failing halfway.
DST_PLATFORM=Windows

DST_BUILD_TYPE=Release

# ZIP rather than NSIS: it needs no installer toolchain present, and an unsigned
# installer is more alarming to a recipient than an archive.
DST_PACKAGE_GENERATOR=ZIP

DST_WS_PORT=8765
