# macOS build target.
#
# Universal Qt binaries (clang_64) cover both Apple silicon and Intel.

# The operating system this target is built on. There is no cross-compilation:
# Qt's deployment tools only run on their own platform, so dst.py refuses to build
# or package a target that is not this machine rather than failing halfway.
DST_PLATFORM=Darwin

DST_BUILD_TYPE=Release

# DragNDrop produces the .dmg a macOS user expects. Note that an unsigned bundle
# arriving by download is quarantined by Gatekeeper, and the recipient needs
# `xattr -dr com.apple.quarantine` on it. Code signing is out of scope.
DST_PACKAGE_GENERATOR=DragNDrop

DST_WS_PORT=8765
