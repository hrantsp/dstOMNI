# Linux build target.
#
# A target describes only what genuinely differs between platforms. The build
# commands themselves are identical everywhere, which is the point of CMake and
# Conan — inventing per-platform command sets would be ceremony, not portability.

# The operating system this target is built on. There is no cross-compilation:
# Qt's deployment tools only run on their own platform, so dst.py refuses to build
# or package a target that is not this machine rather than failing halfway.
DST_PLATFORM=Linux

DST_BUILD_TYPE=Release

# CPack generator. TGZ is universally readable and needs nothing installed.
DST_PACKAGE_GENERATOR=TGZ

# Loopback port the desktop app listens on. The extension must agree; set the same
# value on its options page.
DST_WS_PORT=8765
